<!DOCTYPE html> <!-- Defines the document type as HTML5 -->
<html lang="en"> <!-- Opens the HTML document and sets the language to English -->

<head> <!-- Opens the head section of the document -->
    <meta charset="UTF-8"> <!-- Sets the character encoding to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ensures proper rendering and touch zooming on mobile devices -->
    <title>My portfolio</title> <!-- Sets the title of the document -->
    <link rel="stylesheet" href="style.css"> <!--- Links the CSS file to the HTML document -->
</head> <!-- Closes the head section -->

<body> <!-- Opens the body section of the document -->
    <header> <!-- Opens the header section -->
        <div class="logo">Mohammad Parvej Khan</div> <!-- Displays the logo or name of the website -->
        <nav> <!-- Opens the navigation menu -->
            <li><a href="#about">About</a></li> <!-- Navigation link to the About section -->
            <li><a href="#skills">Skills</a></li> <!-- Navigation link to the Skills section -->
            <li><a href="#projects">Projects</a></li> <!-- Navigation link to the Projects section -->
            <li><a href="#resume">Resume</a></li> <!-- Navigation link to the Resume section -->
            <li><a href="#contact">Contact</a></li> <!-- Navigation link to the Contact section -->
        </nav> <!-- Closes the navigation menu -->
    </header> <!-- Closes the header section -->
</body> <!-- Closes the body section -->

</html> <!-- Closes the HTML document -->
